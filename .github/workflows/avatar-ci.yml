name: Arlecchino integration tests

on:
  push:
    branches:
      - feature/arlecchino-avatar
    paths:
      - "trilion/**"
      - "tests/**"
      - "assets/avatar/**"
      - "assets/vendor/**"
      - "requirements.txt"
      - "trilion.spec"
      - ".github/workflows/avatar-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless test dependencies
        run: python -m pip install pytest requests numpy pillow
      - name: Compile changed Python modules
        run: |
          python -m py_compile trilion/core/persona.py trilion/core/agent.py trilion/core/bridge.py trilion/core/tools.py trilion/ui/avatar.py trilion/ui/main_window.py
      - name: Run test suite
        run: python -m pytest -q tests
